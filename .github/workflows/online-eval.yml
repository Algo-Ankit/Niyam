# Asynchronous online evaluation & closed-loop failure learning from Langfuse traces (D76, D77).
name: Online Eval

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Lookback window in hours"
        required: false
        default: "24"
        type: string
      max_judge:
        description: "Maximum unscored live answers to judge with Gemma"
        required: false
        default: "10"
        type: string
      learn:
        description: "Synthesize, micro-verify, and commit new learned corrections"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Evaluate without writing scores, dataset items, or commits"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  online-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: secrets
        env:
          HAS_LF_PK: ${{ secrets.LANGFUSE_PUBLIC_KEY != '' }}
          HAS_LF_SK: ${{ secrets.LANGFUSE_SECRET_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          missing=""
          [ "$HAS_LF_PK" = "true" ] || missing="$missing LANGFUSE_PUBLIC_KEY"
          [ "$HAS_LF_SK" = "true" ] || missing="$missing LANGFUSE_SECRET_KEY"
          [ "$HAS_GEMINI" = "true" ] || missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, and GEMINI_API_KEY in Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "::notice::Skipping scheduled online-eval until secrets are configured:$missing"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .tools/uv-cache
            .tools/python
          key: tools-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/bootstrap.sh') }}

      - if: steps.secrets.outputs.ready == 'true'
        name: Bootstrap the repo-local toolchain
        run: bash scripts/bootstrap.sh

      - if: steps.secrets.outputs.ready == 'true'
        name: Run online evaluation and harvest failures
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
          DATABASE_URL: postgresql://unused@localhost/unused
        run: |
          hours="${{ inputs.hours || '24' }}"
          max_judge="${{ inputs.max_judge || '10' }}"
          learn_flag="--learn --max-learn 3"
          if [ "${{ inputs.learn }}" = "false" ]; then
            learn_flag=""
          fi
          dry_flag=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_flag="--dry-run"
          fi
          .tools/bootstrap/bin/uv run --frozen niyam online-eval \
            --hours "$hours" \
            --max-judge "$max_judge" \
            --out online-failures.jsonl \
            $learn_flag \
            $dry_flag
          if [ -s online-failures.jsonl ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true' && inputs.dry_run != true
        name: Verify and commit learned corrections (Gate C)
        run: |
          if ! git diff --quiet data/learned_corrections.json; then
            .tools/bootstrap/bin/uv run --frozen niyam eval-gate
            .tools/bootstrap/bin/uv run --frozen pytest -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/learned_corrections.json
            git commit -m "online-eval: learn verified regulation guidance from live traces"
            git push origin HEAD:main
          else
            echo "No new learned corrections to commit."
          fi

      - if: always() && steps.run.outputs.has_failures == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: online-failures
          path: online-failures.jsonl
          retention-days: 30
