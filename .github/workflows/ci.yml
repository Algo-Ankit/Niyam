# Checks on every push and pull request (D68). No eval gate yet: eval baselines are unfinished.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            .tools/uv-cache
            .tools/python
          key: tools-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/bootstrap.sh') }}
      - name: Bootstrap the repo-local toolchain
        run: bash scripts/bootstrap.sh
      - name: Ruff lint
        run: .tools/bootstrap/bin/uv run --frozen ruff check .
      - name: Ruff format
        run: .tools/bootstrap/bin/uv run --frozen ruff format --check .
      - name: Mypy
        run: .tools/bootstrap/bin/uv run --frozen mypy
      - name: Pytest
        run: .tools/bootstrap/bin/uv run --frozen pytest

  # The website (D64, D66) is built in parallel; every step is skipped until web/package.json exists.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - id: detect
        working-directory: .
        run: echo "present=${{ hashFiles('web/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.detect.outputs.present == 'true'
        run: npm run build

  # The API image (D69): built on every push, started and health-checked with dummy settings
  # (no secrets in CI), and published to GitHub Container Registry from main only.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Image name (registry paths must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/niyam-api" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: niyam-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (start the container and check /api/health)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e GEMINI_API_KEY=ci-dummy -e DATABASE_URL=postgresql://ci@localhost/ci \
            -e LANGFUSE_PUBLIC_KEY=ci-dummy -e LANGFUSE_SECRET_KEY=ci-dummy \
            -e LANGFUSE_TRACING=false niyam-api:ci
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/api/health); then break; fi
            sleep 1
          done
          echo "health: $body"
          test "$(echo "$body" | jq -r .status)" = ok
          test "$(echo "$body" | jq -r .corpus_snapshot)" != null
          test "$(docker inspect -f '{{.Config.User}}' niyam-api:ci)" = niyam
      - name: Container logs
        if: failure()
        run: docker logs api
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
