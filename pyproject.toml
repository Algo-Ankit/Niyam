[project]
name = "niyam"
version = "0.1.0"
description = "F-1 student work-rules assistant (OPT, STEM OPT), with evaluation and monitoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=3.3.0",
    "uvicorn>=0.30",
    "langfuse>=5.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "tzdata>=2026.6",
]

[project.scripts]
niyam = "niyam.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Keep every uv artefact inside the repo; never download a Python implicitly.
cache-dir = ".tools/uv-cache"
python-downloads = "manual"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "N",            # naming
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "S",            # security (bandit)
    "RUF",          # ruff-specific
    "PL",           # pylint subset
    "ERA",          # commented-out code
    "T20",          # stray print()
]
ignore = ["PLR2004"]  # magic-number rule is noisy for thresholds named in config

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/niyam/cli.py" = ["T201"]  # the CLI's job is to print
"scripts/bench_generation.py" = ["T201"]  # a benchmark script reports as it runs

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.vercel]
# Vercel imports this module-level app (D69); containers use `niyam.api:create_app --factory`.
entrypoint = "niyam.asgi:app"
